services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: event_platform
      POSTGRES_DB: event_platform_development
    volumes: 
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7


  web:
    build: .
    ports: 
      - 3001:80
    depends_on: 
      - postgresql
      - redis
    environment:
      DATABASE_URL: postgresql://event_platform:password@postgresql/event_platform_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development


  sidekiq:
    build: .
    command: bundle exec sidekiq
    depends_on:
      - postgresql 
      - redis  
    environment:
      DATABASE_URL: postgresql://event_platform:password@postgresql/event_platform_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development


volumes:  
  postgres_data:   